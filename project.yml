name: Pickle
options:
  bundleIdPrefix: com.pickle
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  Pickle:
    type: application
    platform: iOS
    sources:
      - path: Pickle
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickle.tracker
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Pickle/Info.plist
      properties:
        CFBundleDisplayName: Pickle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Pickle reads your body weight to keep your calorie and macro targets accurate over time."
        NSHealthUpdateUsageDescription: "Pickle saves the calories and macros you log to Apple Health."
        NSCameraUsageDescription: "Pickle uses the camera to scan barcodes and estimate meals from a photo."
        NSPhotoLibraryUsageDescription: "Pickle uses photos of your meals to estimate calories and macros."
        ITSAppUsesNonExemptEncryption: NO
        PickleProxyURL: $(PICKLE_PROXY_URL)
    entitlements:
      path: Pickle/Pickle.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pickle.tracker
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - target: PickleWidgetExtension

  PickleWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PickleWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickle.tracker.widget
        INFOPLIST_KEY_CFBundleDisplayName: Pickle
        PRODUCT_NAME: PickleWidget
    info:
      path: PickleWidget/Info.plist
      properties:
        CFBundleDisplayName: Pickle
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PickleWidget/PickleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pickle.tracker

  PickleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickleTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pickle.tracker.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pickle

schemes:
  Pickle:
    build:
      targets:
        Pickle: all
        PickleWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PickleTests
