name: Pickle
options:
  bundleIdPrefix: com.angelvega
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # iPhone-only: exempts the bundle from iPad multitasking's all-orientations rule.
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "DV483F72N3"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  Pickle:
    type: application
    platform: iOS
    sources:
      - path: Pickle
      - path: Shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelvega.pickle
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Pickle/Info.plist
      properties:
        CFBundleDisplayName: Pickle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Pickle reads your body weight to keep your calorie and macro targets accurate over time."
        NSHealthUpdateUsageDescription: "Pickle saves the calories and macros you log to Apple Health."
        NSCameraUsageDescription: "Pickle uses the camera to scan barcodes and estimate meals from a photo."
        NSPhotoLibraryUsageDescription: "Pickle uses photos of your meals to estimate calories and macros."
        ITSAppUsesNonExemptEncryption: NO
        PickleProxyURL: $(PICKLE_PROXY_URL)
    entitlements:
      path: Pickle/Pickle.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pickle.tracker
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.pickle.tracker
        aps-environment: development
    dependencies:
      - target: PickleWidgetExtension

  PickleWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PickleWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelvega.pickle.widget
        INFOPLIST_KEY_CFBundleDisplayName: Pickle
        PRODUCT_NAME: PickleWidget
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PickleWidget/Info.plist
      properties:
        CFBundleDisplayName: Pickle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PickleWidget/PickleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pickle.tracker

  PickleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickleTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelvega.pickle.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pickle

  PickleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PickleUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angelvega.pickle.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pickle
    dependencies:
      - target: Pickle

schemes:
  Pickle:
    build:
      targets:
        Pickle: all
        PickleWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PickleTests
        - PickleUITests
